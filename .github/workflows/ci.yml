name: CI

on:
  push:
    branches: [main, dev-*]
    paths:
      - "drivers/**"
      - "kernel/**"
      - "docker/Dockerfile"
      - "Makefile"
      - "mk/**"
      - "external/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "drivers/**"
      - "kernel/**"
      - "docker/Dockerfile"
      - "Makefile"
      - "mk/**"
      - "external/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nhat092005/build-os-builder
  SDK_IMAGE: ghcr.io/nhat092005/build-os-sdk:gcc14.3-glibc

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init kernel submodule (shallow)
        run: git submodule update --init --depth 1 kernel

      - name: Build Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg SDK_IMAGE=${{ env.SDK_IMAGE }} \
            -t build-os-builder \
            -f docker/Dockerfile .

      - name: Prepare kernel tree
        run: make kernel-prepare

      - name: Verify CONFIG_RUST=y
        run: grep "^CONFIG_RUST=y" kernel/.config

      - name: Build all DTBOs
        run: make dtbo

      - name: Build all modules
        run: make modules

      - name: Build all userspace tools
        run: make tools

      - name: Run checkpatch
        run: |
          docker run --rm \
            -i \
            -v ${{ github.workspace }}:/root \
            -w /root \
            build-os-builder \
            bash -c 'find drivers -type f \( -name "*.c" -o -name "*.h" \) \
              ! -name "*.mod.c" \
              ! -path "*/userspace/*" \
              ! -path "*/common/*" \
              -print0 | \
              xargs -0 kernel/scripts/checkpatch.pl --strict --no-tree -f'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output-${{ github.sha }}
          path: |
            drivers/**/build/dtbo/*.dtbo
            drivers/**/build/module/*.ko
            drivers/**/build/tools/*
          retention-days: 7
          if-no-files-found: warn
