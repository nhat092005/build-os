name: CI

on:
  push:
    branches: [main, dev-*]
    paths:
      - "drivers/**"
      - "kernel/**"
      - "docker/Dockerfile"
      - "Makefile"
      - "mk/**"
      - "external/**"
  pull_request:
    branches: [main]
    paths:
      - "drivers/**"
      - "kernel/**"
      - "docker/Dockerfile"
      - "Makefile"
      - "mk/**"
      - "external/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nhat092005/build-os-builder
  SDK_IMAGE: ghcr.io/nhat092005/build-os-sdk:gcc14.3-glibc

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init kernel submodule (shallow)
        run: git submodule update --init --depth 1 kernel

      - name: Build Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg SDK_IMAGE=${{ env.SDK_IMAGE }} \
            -t build-os-builder \
            -f docker/Dockerfile .

      - name: Prepare kernel tree
        run: make kernel-prepare

      - name: Verify CONFIG_RUST=y
        run: grep "^CONFIG_RUST=y" kernel/.config

      - name: Build all modules
        run: make modules

      - name: Build all DTBOs
        run: make dtbo

      - name: Build all userspace tools
        run: make tools

      - name: Run checkpatch
        run: |
          docker run --rm \
            -i \
            -v ${{ github.workspace }}:/root \
            -w /root \
            build-os-builder \
            bash -c '
              ERRORS=0
              while IFS= read -r -d "" f; do
                OUT=$(kernel/scripts/checkpatch.pl --strict --no-tree -f "$f" 2>&1)
                echo "$OUT"
                if echo "$OUT" | grep -q "^ERROR:"; then
                  ERRORS=$((ERRORS + 1))
                fi
              done < <(find drivers \( -name "*.c" -o -name "*.h" \) -print0)
              if [ "$ERRORS" -gt 0 ]; then
                echo ""
                echo "checkpatch: $ERRORS file(s) with ERRORs — fix before merging"
                exit 1
              fi
              echo "checkpatch: no ERRORs found"
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output-${{ github.sha }}
          path: |
            drivers/**/build/module/*.ko
            drivers/**/build/dtbo/*.dtbo
          retention-days: 7
          if-no-files-found: warn
