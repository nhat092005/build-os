name: CI

on:
  push:
    branches: [main, dev-*]
    paths:
      - "drivers/**"
      - "kernel/**"
      - "docker/Dockerfile"
      - "Makefile"
      - "mk/**"
      - "external/**"
  pull_request:
    branches: [main]
    paths:
      - "drivers/**"
      - "kernel/**"
      - "docker/Dockerfile"
      - "Makefile"
      - "mk/**"
      - "external/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nhat092005/build-os-builder

jobs:
  # ---------------------------------------------------------------------------
  # Build all drivers + checkpatch.
  # Pulls the builder image from ghcr.io (published by docker-publish.yml).
  # ---------------------------------------------------------------------------
  ci:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init kernel submodule (shallow)
        run: git submodule update --init --depth 1 kernel

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull builder image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest build-os-builder

      - name: Prepare kernel tree
        run: make kernel-prepare

      - name: Verify CONFIG_RUST=y
        run: grep "^CONFIG_RUST=y" kernel/.config

      - name: Build all modules
        run: make modules

      - name: Build all DTBOs
        run: make dtbo

      - name: Build all userspace tools
        run: make tools

      - name: Run checkpatch
        run: |
          docker run --rm \
            -i \
            -v ${{ github.workspace }}:/root \
            -w /root \
            build-os-builder \
            bash -c 'find drivers \( -name "*.c" -o -name "*.h" \) -print0 | xargs -0 kernel/scripts/checkpatch.pl --strict --no-tree -f'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output-${{ github.sha }}
          path: |
            drivers/**/build/module/*.ko
            drivers/**/build/dtbo/*.dtbo
          retention-days: 7
          if-no-files-found: warn
