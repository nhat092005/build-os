name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nhat092005/build-os-builder
  SDK_IMAGE: ghcr.io/nhat092005/build-os-sdk:gcc14.3-glibc
  DEFCONFIG: raspberrypi4_64_custom_defconfig

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg SDK_IMAGE=${{ env.SDK_IMAGE }} \
            -t build-os-builder \
            -f docker/Dockerfile .

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: br-dl-${{ hashFiles('external/configs/*_defconfig') }}
          restore-keys: br-dl-

      - name: Configure Buildroot
        run: make buildroot-custom

      - name: Build full OS (Buildroot + kernel + rootfs)
        run: make buildroot

      - name: Build all drivers
        run: make build

      - name: Install tools for stage-output
        run: |
          sudo apt-get install -y --no-install-recommends \
            mtools dosfstools parted e2fsprogs

      - name: Stage output
        run: sudo make stage-output

      - name: Prepare release assets
        id: prep
        run: |
          IMG=buildroot/output/images/sdcard.img
          [ -f "$IMG" ] || { echo "sdcard.img not found"; exit 1; }

          cp "$IMG" sdcard.img
          sha256sum sdcard.img > sdcard.img.sha256

          SIZE_MB=$(( $(stat -c%s sdcard.img) / 1048576 ))
          KVER=$(sed -n 's/^VERSION = //p' kernel/Makefile)
          KPATCH=$(sed -n 's/^PATCHLEVEL = //p' kernel/Makefile)
          KSUB=$(sed -n 's/^SUBLEVEL = //p' kernel/Makefile)

          echo "size=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "kernel=${KVER}.${KPATCH}.${KSUB}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Build OS ${{ github.ref_name }}

            | Detail         | Value                                              |
            |----------------|----------------------------------------------------|
            | **Target**     | Raspberry Pi 4 (aarch64)                           |
            | **Kernel**     | ${{ steps.prep.outputs.kernel }}                   |
            | **Image size** | ${{ steps.prep.outputs.size }}MB                   |
            | **Commit**     | ${{ github.sha }}                                  |
            | **Builder**    | `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest` |

            ### Install
            ```bash
            sudo dd if=sdcard.img of=/dev/sdX bs=4M status=progress && sync
            ```
          files: |
            sdcard.img
            sdcard.img.sha256
