name: Release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nhat092005/build-os-builder
  DEFCONFIG: raspberrypi4_64_custom_defconfig

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull builder image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest build-os-builder

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: br-dl-${{ hashFiles('external/configs/*_defconfig') }}
          restore-keys: br-dl-

      - name: Build full OS (Buildroot + kernel + rootfs)
        # Runs inside Docker: toolchain + Rust baked in, no apt-get needed.
        # Replaces the old double-SDK-build (apt-get → native defconfig → make sdk →
        # install-toolchains → custom defconfig — which also failed because
        # make build-all on host invokes Docker but image was never built).
        run: make buildroot

      - name: Build all drivers
        run: make build

      - name: Install mtools (required for stage-output mcopy)
        run: sudo apt-get install -y --no-install-recommends mtools

      - name: Stage output (requires root for mount/mcopy)
        run: sudo make stage-output

      - name: Prepare release assets
        id: prep
        run: |
          IMG=buildroot/output/images/sdcard.img
          [ -f "$IMG" ] || { echo "sdcard.img not found"; exit 1; }

          cp "$IMG" sdcard.img
          sha256sum sdcard.img > sdcard.img.sha256

          SIZE_MB=$(( $(stat -c%s sdcard.img) / 1048576 ))
          KVER=$(sed -n 's/^VERSION = //p' kernel/Makefile)
          KPATCH=$(sed -n 's/^PATCHLEVEL = //p' kernel/Makefile)
          KSUB=$(sed -n 's/^SUBLEVEL = //p' kernel/Makefile)

          echo "size=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "kernel=${KVER}.${KPATCH}.${KSUB}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Build OS ${{ github.ref_name }}

            | Detail | Value |
            |--------|-------|
            | **Target** | Raspberry Pi 4 (aarch64) |
            | **Kernel** | ${{ steps.prep.outputs.kernel }} |
            | **Image size** | ${{ steps.prep.outputs.size }}MB |
            | **Commit** | ${{ github.sha }} |
            | **Builder** | `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest` |

            ### Install
            ```bash
            sudo dd if=sdcard.img of=/dev/sdX bs=4M status=progress && sync
            ```
          files: |
            sdcard.img
            sdcard.img.sha256
